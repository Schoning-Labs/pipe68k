# Copy this file to settings.ini and edit it. settings.ini is ignored by git. Lines are shell syntax (NAME=value).
# Anything left out is taken from the PATH. The paths below are placeholders; use Git Bash style paths on Windows (/c/...).
# Never put keys or passwords in this file.

# Folder of the OSS CAD Suite (Verilator and Icarus Verilog). Leave out to use verilator and iverilog from the PATH.
#OSS_CAD_SUITE=/path/to/oss-cad-suite

# Perl that runs Verilator's script (the OSS CAD Suite needs the Perl of MSYS2 on Windows).
#PERL=/path/to/perl

# Gowin's command line tool (Gowin EDA V1.9.12.04 only). Leave out to use gw_sh from the PATH.
#GOWIN_SH=/path/to/Gowin/IDE/bin/gw_sh.exe

# Visual Studio 2019 Build Tools, 64-bit environment batch file (Windows paths). Leave out when cl is already on the PATH.
#VCVARS64='<folder of Visual Studio>\VC\Auxiliary\Build\vcvars64.bat'

# Python interpreter.
#PY=python
